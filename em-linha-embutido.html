<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: orange;
            text-decoration: underline;
        }
        code{
            color: limegreen;
            text-decoration: underline;
        }
        body > main > ol > li:nth-child(1) > code{
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
   <div>
    <main>
        <h1>DCC 202 CSS Embutido</h1>

        <p>O estilo <em>em linha</em> é aplicado diretamente aos elementos HTML, 
            utilizando o atributo <code>style</code>.</p>
        <ol>
        <li><code>HELLO WORLD</code></li>
        <li><code> 2 + 2 = 4
        </code></li>
        </ol>
    </main>
   </div>
</body>
</html>
